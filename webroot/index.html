<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>亮度上托</title>
<style>
  :root{
    --bg:#0e1014; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
    --txt:#eef1f6; --sub:#9aa3b2; --amber:#ffb020; --orange:#ff7a3d;
    --green:#3ddc84; --red:#ff5c6c; --blue:#5aa9ff; --purple:#b18cff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{max-width:560px;margin:0 auto;padding:18px 16px 36px;}
  h1{font-size:20px;margin:4px 0 2px;font-weight:700;}
  .sub{color:var(--sub);font-size:12.5px;margin-bottom:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px;margin-bottom:14px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .chip{font-size:11px;color:var(--sub);background:var(--card2);border:1px solid var(--line);
    border-radius:999px;padding:4px 9px;white-space:nowrap;}
  .chip.on{color:#0e1014;background:var(--green);border-color:var(--green);font-weight:600;}
  .chip.off{color:var(--red);}
  .chip.hbm{color:#1a1005;background:var(--amber);border-color:var(--amber);font-weight:600;}
  .big{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px;}
  .big .v{font-size:52px;font-weight:800;line-height:1;
    background:linear-gradient(135deg,var(--amber),var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .big .max{color:var(--sub);font-size:15px;}
  .pct{color:var(--sub);font-size:13px;margin-bottom:14px;}
  .bar{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin-bottom:18px;}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--amber),var(--orange));transition:width .12s;}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;
    background:transparent;margin:6px 0 4px;touch-action:pan-y;}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;
    background:linear-gradient(90deg,#4a3510,#ffb020,#ff7a3d);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
    border-radius:50%;background:#fff;margin-top:-9px;
    box-shadow:0 2px 10px rgba(255,150,40,.55);border:3px solid var(--orange);}
  .scale{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;margin-bottom:6px;}

  .qbtns{display:flex;gap:8px;margin-top:14px;}
  .qbtns button{flex:1;}
  button{background:var(--card2);color:var(--txt);border:1px solid var(--line);
    border-radius:12px;padding:10px 6px;font-size:13px;cursor:pointer;outline:none;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  /* 用 pointer 事件类代替 :active，避免 WebView 卡按不回弹 */
  button.tap{transform:scale(.95);filter:brightness(1.25);}
  @media (hover:hover){ button:hover{filter:brightness(1.15);} }
  button.primary{background:linear-gradient(135deg,var(--amber),var(--orange));
    border:none;color:#1a1005;font-weight:700;}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .seg button{background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:13px 4px;color:var(--sub);font-size:13.5px;}
  .seg button small{display:block;font-size:10.5px;opacity:.8;margin-top:2px;}
  .seg button.active{background:linear-gradient(135deg,var(--amber),var(--orange));
    color:#1a1005;font-weight:700;border-color:transparent;}
  .seg button.active.lock{background:linear-gradient(135deg,#b18cff,#7a5cff);color:#fff;}
  .seg button.danger.active{background:var(--red);color:#fff;}
  .hint{font-size:12px;color:var(--sub);margin-top:12px;line-height:1.7;}

  details summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;
    display:flex;justify-content:space-between;align-items:center;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  details summary::after{content:"▾";color:var(--sub);}
  details[open] summary::after{content:"▴";}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;}
  input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:10px;padding:10px;font-size:14px;}
  .switch-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
    background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .switch-row span{font-size:13px;}
  .sw{position:relative;width:46px;height:26px;flex:none;}
  .sw input{opacity:0;width:0;height:0;}
  .sw i{position:absolute;inset:0;background:#3a3f4b;border-radius:999px;transition:.2s;}
  .sw i::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;}
  .sw input:checked + i{background:linear-gradient(135deg,var(--amber),var(--orange));}
  .sw input:checked + i::after{transform:translateX(20px);}
  .footbtns{display:flex;gap:10px;margin-top:14px;}
  .footbtns button{flex:1;}
  #toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
    background:rgba(20,22,28,.96);border:1px solid var(--line);color:var(--txt);
    padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;
    transition:.25s;max-width:86%;text-align:center;z-index:9;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .banner{background:#3a2330;border:1px solid #6b3a47;color:#ffb4c0;border-radius:12px;
    padding:10px 12px;font-size:12.5px;margin-bottom:14px;display:none;line-height:1.6;
    word-break:break-all;}
</style>
</head>
<body>
  <h1>亮度上托</h1>
  <div class="sub">Brightness Boost v1.2.1 · 直接控制内核背光节点</div>

  <div class="banner" id="banner"></div>

  <div class="card">
    <div class="row">
      <div class="big"><span class="v" id="cur">--</span><span class="max">/ <span id="max">4095</span></span></div>
      <div class="chips">
        <span class="chip" id="chipScreen">屏幕 --</span>
        <span class="chip" id="chipDaemon">守护 --</span>
        <span class="chip" id="chipHbm" style="display:none">HBM</span>
      </div>
    </div>
    <div class="pct" id="pct">--</div>
    <div class="bar"><i id="fill"></i></div>

    <input type="range" id="slider" min="0" max="4095" value="0" step="1">
    <div class="scale"><span>0</span><span>2047 系统满</span><span>3685</span><span id="scaleMax">4095</span></div>

    <div class="qbtns">
      <button data-q="2047">2047<br>系统上限</button>
      <button data-q="3685">3685<br>高亮</button>
      <button data-q="4095" id="btnMax">4095<br>极限</button>
    </div>
  </div>

  <div class="card">
    <div class="seg" id="segMode">
      <button data-mode="manual">手动实时<small>滑杆直写</small></button>
      <button data-mode="boost">自动上托<small>拉满触发</small></button>
      <button data-mode="lock" class="lock">锁定<small>系统抢不回</small></button>
      <button data-mode="off" class="danger">关闭<small>交还系统</small></button>
    </div>
    <div class="hint" id="modeHint"></div>
  </div>

  <div class="card">
    <details>
      <summary>参数设置</summary>
      <div class="grid">
        <div><label>触发下限 TRIGGER</label><input type="number" id="inTrigger"></div>
        <div><label>目标亮度 TARGET</label><input type="number" id="inTarget"></div>
        <div><label>爬升步长 STEP</label><input type="number" id="inStep"></div>
        <div><label>步长间隔 ms</label><input type="number" id="inStepMs"></div>
        <div><label>轮询间隔 ms</label><input type="number" id="inPollMs"></div>
        <div><label>锁定偏差 LOCK_TOL</label><input type="number" id="inLockTol"></div>
      </div>
      <div class="switch-row">
        <span>hbm_mode 自动联动（节点存在时生效）</span>
        <label class="sw"><input type="checkbox" id="swHbm"><i></i></label>
      </div>
      <div class="footbtns">
        <button id="btnSave" class="primary">保存并应用</button>
        <button id="btnRestart">重启守护</button>
      </div>
      <div class="hint">配置 /data/adb/brightness_boost.conf，保存后约 1 秒热生效。</div>
    </details>
  </div>

  <div id="toast"></div>

<script>
const CLI = '/data/adb/modules/brightness_boost/cli.sh';
const $ = id => document.getElementById(id);

/* ========== root 执行层 ==========
 * 官方 KernelSU/APatch 注入接口（以官方 npm kernelsu SDK 为准）：
 *   ksu.exec(cmd, JSON.stringify(options), callbackName)
 *   回调是挂在 window 上的【函数名字符串】，签名 (errno, stdout, stderr)
 * 部分管理器分支是同步 ksu.exec(cmd) 直接返回 stdout，一并兼容。 */
let cbSeq = 0;
const rawApi = window.ksu || window.ap || window.__ksu || null;

function execRaw(cmd){
  return new Promise(resolve => {
    if (!rawApi || typeof rawApi.exec !== 'function'){
      resolve({errno:-100, stdout:'', stderr:'no_api'});
      return;
    }
    const cbName = '__bb_exec_' + (cbSeq++) + '_' + Date.now();
    let done = false;
    const finish = r => {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cbName]; } catch(e){ window[cbName] = undefined; }
      resolve(r);
    };
    const timer = setTimeout(()=>finish({errno:-99, stdout:'', stderr:'timeout'}), 5000);
    window[cbName] = (errno, stdout, stderr) =>
      finish({ errno: errno == null ? 0 : errno, stdout: stdout == null ? '' : stdout, stderr: stderr == null ? '' : stderr });

    const errs = [];
    try {
      const r = rawApi.exec(cmd, '{}', cbName);           // 官方异步三参
      if (typeof r === 'string') return finish({errno:0, stdout:r, stderr:''});
    } catch(e1) {
      errs.push('3arg:' + e1.message);
      try {
        const r = rawApi.exec(cmd, cbName);               // 旧式异步两参
        if (typeof r === 'string') return finish({errno:0, stdout:r, stderr:''});
      } catch(e2) {
        errs.push('2arg:' + e2.message);
        try {
          const r = rawApi.exec(cmd);                     // 同步分支
          if (typeof r === 'string') return finish({errno:0, stdout:r, stderr:''});
        } catch(e3) { errs.push('1arg:' + e3.message); }
        finish({errno:-1, stdout:'', stderr:errs.join(' | ')});
      }
    }
  });
}

function quote(a){ return "'" + String(a).replace(/'/g, "'\\''") + "'"; }
async function cli(args){
  const r = await execRaw('sh ' + CLI + ' ' + args.map(quote).join(' '));
  if ((r.errno !== 0 && !r.stdout) || r.errno === -100){
    return { ok:0, err:'exec_fail', code:r.errno, detail:r.stderr || ('errno=' + r.errno) };
  }
  try { return JSON.parse(r.stdout); }
  catch(e){ return { ok:0, err:'bad_json', detail:(r.stderr||'').slice(0,200), raw:(r.stdout||'').slice(0,200) }; }
}

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
let bannerText = '';
function showBanner(msg){
  bannerText = msg;
  const b = $('banner');
  if (msg){ b.style.display = 'block'; b.textContent = '⚠ ' + msg; }
  else b.style.display = 'none';
}

/* ========== 按钮卡按修复：pointer 事件类替代 :active ========== */
document.querySelectorAll('button').forEach(b => {
  const down = () => b.classList.add('tap');
  const up   = () => b.classList.remove('tap');
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('click', () => b.blur());
});

/* ========== 状态 ========== */
let st = null, dragging = false, failCount = 0, maxSet = false, switchTried = false;

/* 写亮度单通道队列：快速拖动只保留最新值，且保证执行顺序 */
let pending = null, writing = false;
function requestSet(v){ pending = v; pump(); }
async function pump(){
  if (writing) return;
  writing = true;
  try {
    while (pending !== null){
      const v = pending; pending = null;
      const r = await cli(['set', v]);
      if (r.ok){ $('cur').textContent = r.cur; updateVisual(r.cur); failCount = 0; showBanner(''); }
      else { failCount++; if (failCount >= 2) showBanner('写亮度失败：' + (r.detail || r.err)); }
    }
  } finally { writing = false; }
}

function updateVisual(v){
  const mx = st ? st.max : 4095;
  const p = Math.max(0, Math.min(100, v / mx * 100));
  $('fill').style.width = p.toFixed(1) + '%';
  $('pct').textContent = p.toFixed(1) + '%';
  if (!dragging) $('slider').value = v;
}

const HINTS = {
  manual: '• <b>手动实时</b>：拖滑杆立即写入节点，守护不干预<br>• 屏幕亮度由你完全掌控',
  boost:  '• <b>自动上托</b>：把亮度条拉到系统最大档(2047)，自动平滑爬到目标值<br>• 息屏/调暗/被系统抢回时自动让步',
  lock:   '• <b>锁定</b>：写住滑杆选定的亮度，DisplayEngine 一抢回就立即写回去<br>• 检测到持续对抢会短暂停手 5 秒防闪烁，随后继续夺回<br>• 息屏暂停，亮屏自动恢复锁定',
  off:    '• <b>关闭</b>：守护停止，亮度完全交还系统<br>• 滑杆仍可临时写值，但不会被保持'
};

function renderStatus(s){
  st = s;
  if (!maxSet || +$('slider').max !== s.max){
    $('slider').max = s.max; $('max').textContent = s.max;
    $('scaleMax').textContent = s.max; maxSet = true;
  }
  $('cur').textContent = s.cur;
  updateVisual(s.cur);

  const cs = $('chipScreen');
  cs.textContent = s.screen ? '屏幕亮' : '已息屏';
  cs.className = 'chip' + (s.screen ? ' on' : ' off');

  const cd = $('chipDaemon');
  cd.textContent = s.alive ? '守护运行' : '守护停止';
  cd.className = 'chip' + (s.alive ? ' on' : ' off');

  const ch = $('chipHbm');
  if (s.hbm_exist){
    ch.style.display = '';
    ch.textContent = 'hbm_mode=' + s.hbm;
    ch.className = 'chip' + (s.hbm === 1 ? ' hbm' : '');
  } else ch.style.display = 'none';

  const active = s.enable === 1 ? s.mode : 'off';
  document.querySelectorAll('#segMode button').forEach(b=>{
    const on = b.dataset.mode === active;
    b.classList.toggle('active', on);
  });
  $('modeHint').innerHTML = HINTS[active] || '';

  if (!document.activeElement || document.activeElement.tagName !== 'INPUT'){
    $('inTrigger').value = s.trigger; $('inTarget').value = s.target;
    $('inStep').value = s.step; $('inStepMs').value = s.step_ms;
    $('inPollMs').value = s.poll_ms; $('inLockTol').value = s.lock_tol ?? 40;
    $('swHbm').checked = (String(s.hbm_auto) === '1');
  }
}

async function refresh(){
  try {
    const s = await cli(['status']);
    if (s.ok){ showBanner(''); renderStatus(s); failCount = 0; }
    else {
      failCount++;
      if (failCount === 2)
        showBanner('root 接口调用失败（' + (s.detail || s.err) + '）。请确认从 KernelSU 管理器的模块网页图标进入本页。');
    }
  } catch(e){
    failCount++;
    if (failCount === 2) showBanner('页面异常：' + (e && e.message ? e.message : e));
  } finally {
    // 无论渲染是否抛错都必须排下一轮，否则轮询链永久中断
    setTimeout(refresh, 800);
  }
}

/* ========== 滑杆 ========== */
$('slider').addEventListener('input', e => {
  dragging = true;
  const v = +e.target.value;
  $('cur').textContent = v; updateVisual(v);
  // boost 模式下第一次拖动 -> 自动切手动，防止守护跟手抢
  if (!switchTried && st && st.enable === 1 && st.mode === 'boost'){
    switchTried = true;
    cli(['mode','manual']).then(()=>toast('已切换为手动实时'));
  }
  requestSet(v);
});
$('slider').addEventListener('change', e => requestSet(+e.target.value));
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  $('slider').addEventListener(ev, ()=>setTimeout(()=>{dragging=false;switchTried=false;},900)));

/* ========== 快捷档 ========== */
document.querySelectorAll('.qbtns button').forEach(b=>{
  b.addEventListener('click', async ()=>{
    let v = +b.dataset.q;
    if (st) v = Math.min(v, st.max);
    if (st && st.enable === 1 && st.mode === 'boost') await cli(['mode','manual']);
    dragging = true;
    $('slider').value = v; $('cur').textContent = v; updateVisual(v);
    await cli(['set', v]);
    setTimeout(()=>dragging=false, 800);
  });
});

/* ========== 模式切换 ========== */
document.querySelectorAll('#segMode button').forEach(b=>{
  b.addEventListener('click', async ()=>{
    const m = b.dataset.mode;
    b.classList.add('active');
    if (m === 'off'){
      await cli(['enable','0']); toast('已关闭，亮度交还系统');
    } else if (m === 'lock'){
      await cli(['mode','lock']); toast('已锁定当前亮度，拖滑杆可改锁定值');
    } else if (m === 'boost'){
      await cli(['enable','1']); await cli(['mode','boost']); toast('自动上托已开启');
    } else {
      await cli(['enable','1']); await cli(['mode','manual']); toast('手动实时模式');
    }
    const s = await cli(['status']); if (s.ok) renderStatus(s);
  });
});

/* ========== 参数 ========== */
$('swHbm').addEventListener('change', async e=>{
  await cli(['save','HBM_AUTO', e.target.checked ? '1' : '0']);
  toast(e.target.checked ? 'hbm_mode 联动已开启' : 'hbm_mode 联动已关闭');
});

$('btnSave').addEventListener('click', async ()=>{
  const pairs = [
    ['TRIGGER', $('inTrigger').value], ['TARGET', $('inTarget').value],
    ['STEP', $('inStep').value], ['STEP_MS', $('inStepMs').value],
    ['POLL_MS', $('inPollMs').value], ['LOCK_TOL', $('inLockTol').value]
  ];
  for (const [k,v] of pairs){
    if (v === '' || +v < 0){ toast(k + ' 数值不合法'); return; }
    const r = await cli(['save', k, v]);
    if (!r.ok){ toast('保存失败: ' + k); return; }
  }
  toast('已保存，约 1 秒后生效');
  const s = await cli(['status']); if (s.ok) renderStatus(s);
});
$('btnRestart').addEventListener('click', async ()=>{
  await cli(['restart']); toast('守护已重启');
  setTimeout(async()=>{ const s = await cli(['status']); if (s.ok) renderStatus(s); }, 1500);
});

refresh();
</script>
</body>
</html>
